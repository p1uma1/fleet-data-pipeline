services:
  kafka:
    image: bitnami/kafka:3.7
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_CFG_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_KRAFT_CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server 127.0.0.1:29092 --list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic fleet.telemetry --partitions 3 --replication-factor 1
      && kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists
      --topic fleet.alerts --partitions 1 --replication-factor 1
      && kafka-topics.sh --bootstrap-server kafka:29092 --list

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./streaming/sql/analytics_tables.sql:/docker-entrypoint-initdb.d/01-analytics_tables.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 10

  spark:
    build:
      context: ./streaming
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    working_dir: /opt/project
    volumes:
      - ./:/opt/project
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      TELEMETRY_TOPIC: fleet.telemetry
      ALERTS_TOPIC: fleet.alerts
      KAFKA_STARTING_OFFSETS: latest
      JDBC_URL: jdbc:postgresql://postgres:5432/fleet
      DATABASE_URL: postgresql://fleet:fleet@postgres:5432/fleet
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      CHECKPOINT_DIR: /opt/project/checkpoints
      PYTHONPATH: /opt/project/streaming
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
    command: ["sleep", "infinity"]

volumes:
  postgres-data:
